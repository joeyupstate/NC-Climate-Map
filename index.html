<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NC Climate Map</title>
    <meta name="description" content="North Carolina plant hardiness zones and palm recommendations from 20 winters of real low-temperature data." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="app">
      <aside class="panel" id="info-panel">
        <div class="panel__top" id="panel-top">
        <header class="brand">
          <span class="brand__mark" aria-hidden="true">
            <img src="/palm-illustration.png" alt="" />
          </span>
          <div>
            <h1 class="brand__title">NC Climate Map</h1>
            <p class="brand__tagline">Hardiness zones &amp; palms from 20 winters of real temperature data</p>
          </div>
        </header>

        <fieldset class="window" disabled>
          <legend class="window__label">Zone based on the past</legend>
          <div class="chips" id="zone-window"></div>
          <p class="window__span" id="window-span">Loading data…</p>
        </fieldset>
        </div>

        <!-- Desktop: the rest of the sidebar. Phones: a bottom sheet over the map. -->
        <section class="sheet" id="sheet" data-state="peek">
          <button type="button" class="sheet__handle" id="sheet-handle" aria-label="Show more details" aria-expanded="false">
            <span class="sheet__grip" aria-hidden="true"></span>
          </button>
          <div class="panel__body" id="info-body" aria-live="polite"></div>
        </section>
      </aside>
      <div class="map" id="map" role="application" aria-label="Map of North Carolina"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
